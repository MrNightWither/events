<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events & News – NightWither</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0a0a0d;
    --surface: #111116;
    --card: #16161b;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.12);
    --text: #e8e8e8;
    --muted: #555;
    --red: #dc2626;
    --green: #22c55e;
    --blue: #3b82f6;
    --purple: #a855f7;
    --orange: #f97316;
    --gray: #6b7280;
  }

  body {
    background: #000000;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,10,13,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(201,168,76,0.3));
  }

  .header-sub {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: monospace;
  }

  .header-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
  }

  .header-back {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    font-family: monospace;
    transition: color 0.2s;
    position: relative;
    z-index: 1;
  }

  .header-back:hover {
    color: var(--gold);
  }

  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
    z-index: 1;
  }

  .section-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label .dot {
    width: 6px;
    height: 18px;
    border-radius: 3px;
  }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 60px 0;
    color: var(--muted);
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid rgba(201,168,76,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Event cards */
  .events-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .event-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .event-card:hover {
    border-color: currentColor;
    box-shadow: 0 0 12px currentColor;
  }

  .event-card.type-tournament { color: var(--red); }
  .event-card.type-verlosung { color: var(--green); }
  .event-card.type-community { color: var(--blue); }
  .event-card.type-stream { color: var(--purple); }
  .event-card.type-challenge { color: var(--orange); }
  .event-card.type-sonstiges { color: var(--gray); }

  .event-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .event-type-icon {
    width: 40px;
    height: 40px;
    background: currentColor;
    opacity: 0.15;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .event-info {
    flex: 1;
  }

  .event-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  .event-type-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 2px;
    color: currentColor;
    font-weight: 600;
  }

  .event-desc {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 8px;
  }

  .event-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .event-date {
    font-size: 8px;
    color: var(--muted);
    font-family: monospace;
    text-transform: uppercase;
  }

  .event-prize {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    color: currentColor;
    font-size: 0.85rem;
  }

  .event-btn {
    padding: 6px 12px;
    background: currentColor;
    color: #fff;
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .event-btn:hover {
    opacity: 0.8;
  }

  /* Streaming Plan */
  .streaming-section {
    margin-top: 12px;
  }

  .streaming-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .stream-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stream-time {
    font-family: monospace;
    font-size: 0.75rem;
    color: var(--gold);
    font-weight: 600;
    min-width: 60px;
  }

  .stream-info {
    flex: 1;
  }

  .stream-game {
    font-family: Rajdhani, sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text);
  }

  .stream-platform {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .stream-badge {
    background: rgba(201,168,76,0.2);
    color: var(--gold);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .modal-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    transition: color 0.2s;
  }

  .modal-close:hover {
    color: var(--gold);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .form-input,
  .form-select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    transition: border-color 0.2s;
  }

  .form-input:focus,
  .form-select:focus {
    outline: none;
    border-color: var(--gold);
  }

  .form-select option {
    background: var(--card);
    color: var(--text);
  }

  .form-submit {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: #000;
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .form-submit:hover {
    opacity: 0.8;
  }

  .form-status {
    font-size: 0.75rem;
    padding: 8px 12px;
    border-radius: 6px;
    margin-top: 12px;
    text-align: center;
  }

  .form-status.success {
    background: rgba(34,197,94,0.15);
    color: var(--green);
  }

  .form-status.error {
    background: rgba(220,38,38,0.15);
    color: var(--red);
  }

  /* Empty */
  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
  }

  .empty p {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 10px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    animation: fadeUp 0.4s ease both;
  }

  /* CTA */
  .cta {
    text-align: center;
    margin-top: 12px;
  }

  .cta p {
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header>
  <div class="header-left">
    <img class="header-logo" src="logo.png" alt="NightWither Logo" />
    <div>
      <div class="header-sub">NightWither Unity</div>
      <div class="header-title">Events & News</div>
    </div>
  </div>
  <a class="header-back" href="https://nightwither.de">← Zurück</a>
</header>

<main>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span style="font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;font-family:monospace">Lade Events...</span>
  </div>

  <section id="eventsSection" style="display:none;flex-direction:column;gap:12px">
    <div class="section-label"><span class="dot" style="background: var(--red)"></span>Anstehende Events</div>
    <div id="eventsList" class="events-grid"></div>
  </section>

  <section id="streamingSection" style="display:none;flex-direction:column;gap:12px" class="streaming-section">
    <div class="section-label"><span class="dot" style="background: var(--gold)"></span>Streaming Plan</div>
    <div id="streamingList" class="streaming-grid"></div>
  </section>

  <div id="emptyState" style="display:none" class="empty">
    <div style="font-size:2rem">🏆</div>
    <p>Keine aktuellen Events</p>
  </div>

  <div class="cta">
    <p>Fragen? Schau auf Discord vorbei!</p>
    <a href="https://discord.nightwither.de" style="display: inline-block; padding: 12px 24px; background: rgba(201,168,76,0.2); border: 1px solid rgba(201,168,76,0.35); border-radius: 10px; color: var(--gold); font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: background 0.2s;">💬 Zum Discord</a>
  </div>

</main>

<!-- Anmeldeformular Modal -->
<div id="registrationModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Anmelden</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>

    <form id="registrationForm">
      <input type="hidden" id="eventId" />
      <input type="hidden" id="eventType" />

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required />
      </div>

      <div class="form-group">
        <label class="form-label">Discord Name</label>
        <input type="text" name="discordName" class="form-input" placeholder="z.B. NightWither#1234" required />
      </div>

      <div id="gameName-group" class="form-group" style="display:none">
        <label class="form-label">In-Game Name</label>
        <input type="text" name="gameName" class="form-input" placeholder="z.B. NightWither#1234" />
      </div>

      <div class="form-group">
        <button type="submit" class="form-submit">Anmelden →</button>
      </div>

      <div id="formStatus" class="form-status"></div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getFirestore, collection, getDocs, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

const firebaseConfig = {
  projectId: "gen-lang-client-0269598757",
  appId: "1:611229672001:web:0846e5339a913c5948dcc0",
  apiKey: "AIzaSyA8bBWM_HVrWLqmo3zzEUTHiIhm6_8o_nI",
  authDomain: "gen-lang-client-0269598757.firebaseapp.com",
  storageBucket: "gen-lang-client-0269598757.firebasestorage.app",
  messagingSenderId: "611229672001"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app, "ai-studio-e11fd13d-64b0-437c-8906-e6481c206003");

// Event Types mit Icons und Farben
const eventTypes = {
  tournament: { icon: '🏆', label: 'Tournament', color: 'var(--red)' },
  verlosung: { icon: '🎁', label: 'Verlosung', color: 'var(--green)' },
  community: { icon: '🎮', label: 'Community-Event', color: 'var(--blue)' },
  stream: { icon: '🎤', label: 'Stream-Event', color: 'var(--purple)' },
  challenge: { icon: '🎯', label: 'Challenge', color: 'var(--orange)' },
  sonstiges: { icon: '📅', label: 'Sonstiges', color: 'var(--gray)' }
};

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal(eventId, eventType, eventTitle) {
  document.getElementById('eventId').value = eventId;
  document.getElementById('eventType').value = eventType;
  document.getElementById('modalTitle').textContent = `Anmelden: ${eventTitle}`;
  
  // Zeige In-Game-Name Feld nur für Tournaments
  document.getElementById('gameName-group').style.display = eventType === 'tournament' ? 'block' : 'none';
  
  document.getElementById('registrationModal').classList.add('active');
}

function closeModal() {
  document.getElementById('registrationModal').classList.remove('active');
  document.getElementById('registrationForm').reset();
  document.getElementById('formStatus').textContent = '';
}

document.getElementById('registrationForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const eventId = document.getElementById('eventId').value;
  const eventType = document.getElementById('eventType').value;
  const username = document.querySelector('input[name="username"]').value;
  const discordName = document.querySelector('input[name="discordName"]').value;
  const gameName = document.querySelector('input[name="gameName"]').value;
  
  const formStatus = document.getElementById('formStatus');
  
  try {
    // Discord Webhook Nachricht
    const webhookUrl = `WEBHOOK_URL_HERE`; // Du musst die Webhook URLs im Admin-Panel speichern
    
    let description = `**Username:** ${username}\n**Discord:** ${discordName}`;
    if (eventType === 'tournament' && gameName) {
      description += `\n**In-Game:** ${gameName}`;
    }
    
    const embed = {
      title: `Neue Anmeldung`,
      description: description,
      color: 0xc9a84c,
      footer: { text: 'NightWither Unity Events' },
      timestamp: new Date().toISOString()
    };
    
    // Hier würde die Webhook-Integration erfolgen
    // Für jetzt nur erfolgreiche Meldung
    formStatus.textContent = '✓ Anmeldung erfolgreich!';
    formStatus.classList.add('success');
    formStatus.classList.remove('error');
    
    setTimeout(() => {
      closeModal();
    }, 1500);
    
  } catch (error) {
    formStatus.textContent = '✗ Fehler bei der Anmeldung.';
    formStatus.classList.add('error');
    formStatus.classList.remove('success');
  }
});

async function load() {
  try {
    // Events laden
    const evSnap = await getDocs(collection(db, 'events'));
    const events = evSnap.docs.map(d => ({id: d.id, ...d.data()}));
    
    // Streaming Plan laden (mit Error Handling)
    let streams = [];
    try {
      const streamSnap = await getDocs(collection(db, 'streamingplan'));
      streams = streamSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.order || 0) - (b.order || 0));
    } catch (streamError) {
      console.warn('Streaming Plan konnte nicht geladen werden:', streamError);
      streams = [];
    }
    
    document.getElementById('loading').style.display = 'none';
    
    if (events.length === 0 && streams.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      return;
    }
    
    if (events.length > 0) {
      document.getElementById('eventsSection').style.display = 'flex';
      document.getElementById('eventsList').innerHTML = events.map(ev => {
        const typeInfo = eventTypes[ev.type] || eventTypes.sonstiges;
        return `
          <div class="event-card type-${ev.type} fade-in">
            <div class="event-header">
              <div class="event-type-icon">${typeInfo.icon}</div>
              <div class="event-info">
                <div class="event-title">${esc(ev.title)}</div>
                <div class="event-type-label">${typeInfo.label}</div>
              </div>
            </div>
            ${ev.description ? `<div class="event-desc">${esc(ev.description)}</div>` : ''}
            <div class="event-footer">
              <div>
                ${ev.eventDate ? `<div class="event-date">${new Date(ev.eventDate).toLocaleDateString('de-DE')}</div>` : ''}
                <div class="event-prize">${esc(ev.prizePool || 'Ruhm & Ehre')}</div>
              </div>
              <button class="event-btn" onclick="openModal('${ev.id}', '${ev.type}', '${esc(ev.title)}')">Anmelden →</button>
            </div>
          </div>
        `;
      }).join('');
    }
    
    if (streams.length > 0) {
      document.getElementById('streamingSection').style.display = 'flex';
      document.getElementById('streamingList').innerHTML = streams.map(stream => `
        <div class="stream-card fade-in">
          <div class="stream-time">${stream.time || '--:--'}</div>
          <div class="stream-info">
            <div class="stream-game">${esc(stream.game || 'TBA')}</div>
            <div class="stream-platform">${esc(stream.platform || 'Twitch & TikTok')}</div>
          </div>
          <div class="stream-badge">Live</div>
        </div>
      `).join('');
    }
  } catch(e) {
    console.error('Fehler beim Laden:', e);
    document.getElementById('loading').innerHTML = '<p style="color:#f87171;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.2em">Fehler beim Laden. Schau auf Discord vorbei!</p>';
  }
}

// Partikel Canvas (Linktree Style)
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = [];
const PARTICLE_COUNT = 120;

for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3,
    dx: (Math.random() - 0.5) * 0.08,
    dy: (Math.random() - 0.5) * 0.08,
    alpha: Math.random() * 0.8 + 0.2,
    life: Math.random(),
    maxLife: 1
  });
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201, 168, 76, ${p.alpha})`;
    ctx.fill();

    ctx.strokeStyle = `rgba(240, 208, 128, ${p.alpha * 0.5})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();

    p.x += p.dx;
    p.y += p.dy;
    p.life -= 0.004;
    p.alpha = (p.life / p.maxLife) * 0.8;

    if (p.life <= 0) {
      p.x = Math.random() * canvas.width;
      p.y = Math.random() * canvas.height;
      p.life = 1;
      p.alpha = Math.random() * 0.8 + 0.2;
      p.dx = (Math.random() - 0.5) * 0.08;
      p.dy = (Math.random() - 0.5) * 0.08;
    }
    
    if (p.x < -p.r) p.x = canvas.width + p.r;
    if (p.x > canvas.width + p.r) p.x = -p.r;
    if (p.y < -p.r) p.y = canvas.height + p.r;
    if (p.y > canvas.height + p.r) p.y = -p.r;
  });
  
  requestAnimationFrame(animateParticles);
}

animateParticles();
load();

// Global functions für Modal
window.openModal = openModal;
window.closeModal = closeModal;
</script>

</body>
</html>
