<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events &amp; News NightWither</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src https://firestore.googleapis.com https://nwu-anmeldung.nwu-brand.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="description" content="Events, Turniere und Streaming Plan von NightWither Unity">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/rajdhani-500.woff') format('woff'); }
  @font-face { font-family: 'Rajdhani'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/rajdhani-700.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/inter-400.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/inter-500.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/inter-600.woff') format('woff'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0a0a0d;
    --surface: #111116;
    --card: #16161b;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --text: #e8e8e8;
    --muted: #888;
    --red: #dc2626;
    --green: #22c55e;
    --blue: #3b82f6;
    --purple: #a855f7;
    --orange: #f97316;
    --gray: #6b7280;
  }

  body {
    background: #000000;
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,10,13,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(201,168,76,0.3));
  }

  .header-sub {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: monospace;
  }

  .header-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
  }

  .header-back {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    font-family: monospace;
    transition: color 0.2s;
    position: relative;
    z-index: 1;
  }

  .header-back:hover {
    color: var(--gold);
  }

  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
    z-index: 1;
  }

  .section-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label .dot {
    width: 6px;
    height: 18px;
    border-radius: 3px;
  }

  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 60px 0;
    color: var(--muted);
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid rgba(201,168,76,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Event Grid */
  .events-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  /* Event Card - Responsive Layout */
  .event-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: all 0.2s;
  }

  @media (min-width: 480px) {
    .event-card {
      display: grid;
      grid-template-columns: 65px 1fr 105px;
      gap: 12px;
      align-items: start;
      flex-direction: row;
    }
  }

  .event-card:hover {
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(201,168,76,0.1);
  }

  /* Linke Spalte - Zeit & Datum */
  .event-time {
    font-family: monospace;
    font-size: 0.8rem;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-align: left;
    line-height: 1.6;
  }

  /* Mittlere Spalte - Inhalt */
  .event-content {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .event-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    line-height: 1.2;
  }

  .event-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 0.7rem;
  }

  .event-type {
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .event-card.type-tournament .event-type { color: var(--red); }
  .event-card.type-verlosung .event-type { color: var(--green); }
  .event-card.type-community .event-type { color: var(--blue); }
  .event-card.type-stream .event-type { color: var(--purple); }
  .event-card.type-challenge .event-type { color: var(--orange); }
  .event-card.type-sonstiges .event-type { color: var(--gray); }

  .event-prize-line {
    font-size: 0.7rem;
    display: flex;
    gap: 3px;
    align-items: center;
    flex-wrap: nowrap;
    width: 100%;
  }

  .event-prize-label {
    color: var(--muted);
    white-space: nowrap;
    font-size: 0.65rem;
  }

  .event-prize {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    white-space: nowrap;
  }

  .event-card.type-tournament .event-prize { color: var(--red); }
  .event-card.type-verlosung .event-prize { color: var(--green); }
  .event-card.type-community .event-prize { color: var(--blue); }
  .event-card.type-stream .event-prize { color: var(--purple); }
  .event-card.type-challenge .event-prize { color: var(--orange); }
  .event-card.type-sonstiges .event-prize { color: var(--gray); }

  .event-desc {
    font-size: 0.65rem;
    color: var(--muted);
    line-height: 1.4;
    margin-top: 4px;
  }

  /* Rechte Spalte - Button */
  .event-button {
    display: flex;
    align-items: flex-start;
    width: 100%;
  }

  @media (min-width: 480px) {
    .event-button {
      width: auto;
    }
  }

  .event-btn {
    padding: 10px 12px;
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
    color: #fff;
    white-space: nowrap;
    width: 100%;
  }

  @media (min-width: 480px) {
    .event-btn {
      width: auto;
    }
  }

  .event-card.type-tournament .event-btn { background: var(--red); }
  .event-card.type-verlosung .event-btn { background: var(--green); }
  .event-card.type-community .event-btn { background: var(--blue); }
  .event-card.type-stream .event-btn { background: var(--purple); }
  .event-card.type-challenge .event-btn { background: var(--orange); }
  .event-card.type-sonstiges .event-btn { background: var(--gray); }

  .event-btn:hover {
    opacity: 0.8;
  }

  /* Streaming Plan */
  .streaming-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .stream-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stream-time {
    font-family: monospace;
    font-size: 0.8rem;
    color: var(--gold);
    font-weight: 700;
    min-width: 70px;
    letter-spacing: 0.05em;
  }

  .stream-info {
    flex: 1;
  }

  .stream-game {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stream-platform {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 3px;
  }

  .stream-badge {
    background: rgba(220,38,38,0.2);
    color: var(--red);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .modal-title {
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    transition: color 0.2s;
  }

  .modal-close:hover {
    color: var(--gold);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .form-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    transition: border-color 0.2s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .form-submit {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    color: #000;
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .form-submit:hover {
    opacity: 0.8;
  }

  .form-status {
    font-size: 0.75rem;
    padding: 8px 12px;
    border-radius: 6px;
    margin-top: 12px;
    text-align: center;
  }

  .form-status.success {
    background: rgba(34,197,94,0.15);
    color: var(--green);
  }

  .form-status.error {
    background: rgba(220,38,38,0.15);
    color: var(--red);
  }

  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
  }

  .empty p {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 10px;
  }

  .cta {
    text-align: center;
    margin-top: 20px;
  }

  .cta p {
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .cta-btn {
    display: inline-block;
    padding: 12px 24px;
    background: rgba(201,168,76,0.15);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 10px;
    color: var(--gold);
    font-family: Rajdhani, sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.2s;
  }

  .cta-btn:hover {
    background: rgba(201,168,76,0.25);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    animation: fadeUp 0.4s ease both;
  }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .form-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
  .form-consent input { margin-top: 3px; accent-color: var(--gold); flex-shrink: 0; }
  .form-consent a { color: var(--gold); }
  .form-submit:disabled { opacity: 0.5; cursor: wait; }
  button:focus-visible, a:focus-visible, .form-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  /* Zurück zu allen Kanälen */
  .nw-back {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 0 16px 0 12px;
    border: 1px solid rgba(201, 168, 76, 0.4); border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: #e8e8e8; text-decoration: none; white-space: nowrap;
    font-family: Rajdhani, 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase;
    position: relative; z-index: 5;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .nw-back:hover, .nw-back:focus-visible { border-color: #c9a84c; color: #c9a84c; background: rgba(201, 168, 76, 0.08); }
  .nw-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header>
  <div class="header-left">
    <img class="header-logo" src="logo.png" alt="NightWither Logo" />
    <div>
      <div class="header-sub">NightWither Unity</div>
      <div class="header-title">Events & News</div>
    </div>
  </div>
  <a class="nw-back" href="https://nightwither.de" aria-label="Zurück zu allen Kanälen von NightWither"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Alle Kanäle</a>
</header>

<main>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span style="font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;font-family:monospace">Lade Events...</span>
  </div>

  <section id="eventsSection" style="display:none;flex-direction:column;gap:12px">
    <div class="section-label"><span class="dot" style="background: var(--red)"></span>Anstehende Events</div>
    <div id="eventsList" class="events-grid"></div>
  </section>

  <section id="streamingSection" style="display:none;flex-direction:column;gap:12px">
    <div class="section-label"><span class="dot" style="background: var(--gold)"></span>Streaming Plan</div>
    <div id="streamingList" class="streaming-grid"></div>
  </section>

  <div id="emptyState" style="display:none" class="empty">
    <div style="font-size:2rem">🏆</div>
    <p>Keine aktuellen Events</p>
  </div>

  <div class="cta">
    <p>Fragen? Schau auf Discord vorbei!</p>
    <a href="https://discord.nightwither.de" class="cta-btn">💬 Zum Discord</a>
  </div>

</main>

<!-- Anmeldeformular Modal -->
<div id="registrationModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Anmelden</div>
      <button class="modal-close" id="modalClose" type="button" aria-label="Schließen">&times;</button>
    </div>

    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="fUsername">Username</label>
        <input type="text" id="fUsername" class="form-input" maxlength="40" autocomplete="nickname" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="fDiscord">Discord Name</label>
        <input type="text" id="fDiscord" class="form-input" maxlength="40" placeholder="z.B. nightwither" required />
      </div>

      <div id="gameName-group" class="form-group" style="display:none">
        <label class="form-label" for="fGame">In Game Name</label>
        <input type="text" id="fGame" class="form-input" maxlength="40" placeholder="z.B. NightWither#1234567" />
      </div>

      <div class="hp" aria-hidden="true">
        <label for="fWebsite">Webseite</label>
        <input type="text" id="fWebsite" tabindex="-1" autocomplete="off" />
      </div>

      <div class="form-group">
        <label class="form-consent">
          <input type="checkbox" id="fConsent" required />
          <span>Ich bin einverstanden, dass meine Angaben zur Organisation des Events an den Discord Server von NightWither Unity übermittelt werden. Mehr dazu in der <a href="https://datenschutz.nightwither.de" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a>.</span>
        </label>
      </div>

      <div class="form-group">
        <button type="submit" id="fSubmit" class="form-submit">Anmelden</button>
      </div>

      <div id="formStatus" class="form-status" role="status"></div>
    </form>
  </div>
</div>

<script src="events.js?v=20260910c"></script>

</body>
</html>
